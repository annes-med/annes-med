/* ---------------- helpers ---------------- */
function setCam(x,y,ax,ay,show){
  const ang=Math.atan2(ay-y,ax-x);
  phone.setAttribute('transform',`translate(${x},${y}) rotate(${(ang*180/Math.PI-90).toFixed(1)})`);
  phone.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(ang*180/Math.PI+90).toFixed(1)})`);
  const d=Math.hypot(ax-x,ay-y),sp=Math.max(70,d*0.28),nx=-Math.sin(ang),ny=Math.cos(ang);
  cone.setAttribute('points',`${x},${y} ${(ax+nx*sp).toFixed(1)},${(ay+ny*sp).toFixed(1)} ${(ax-nx*sp).toFixed(1)},${(ay-ny*sp).toFixed(1)}`);
  cone.setAttribute('opacity',show.toFixed(3));
  const overhead=y<640;
  legs.forEach((l,i)=>{const fx=overhead?[200,240,280][i]:x+[-60,0,60][i];l.setAttribute('x1',overhead?240:x);l.setAttribute('y1',overhead?660:y+44);l.setAttribute('x2',fx);l.setAttribute('y2',1098)});
  arm2.setAttribute('opacity',overhead?1:0);
  arm2.setAttribute('x1',240);arm2.setAttribute('y1',660);arm2.setAttribute('x2',x);arm2.setAttribute('y2',y);
}
function setArm(hx,hy){
  const sx=865,sy=760; const ex=(sx+hx)/2+10, ey=Math.max(sy,hy)+40;
  arm.setAttribute('d',`M${sx},${sy} Q${ex},${ey} ${hx.toFixed(1)},${hy.toFixed(1)}`);
  hand.setAttribute('cx',hx.toFixed(1));hand.setAttribute('cy',hy.toFixed(1));
}
function showPv(kind,o){for(const k in pv)pv[k].setAttribute('opacity',k===kind?o.toFixed(3):0)}
function txt(id,s){const e=$(id);if(e.textContent!==s)e.textContent=s}
function fade(e,o,dy=0){e.style.opacity=o.toFixed(3);e.style.transform=`translateY(${dy.toFixed(1)}px)`}

/* ---------------- render ---------------- */
window.render=function(t){
  let si=S.findIndex(s=>t>=s[0]&&t<s[1]); if(si<0)si=S.length-1;
  const [a,b,badge,title,sub,tip,c]=S[si]; const u=t-a, L=b-a;
  const io=Math.min(eOut(prog(u,0,.45)),1-eIO(prog(u,L-.35,L)));   // scene in/out
  const isStep=!!badge;
  txt('badge',badge);txt('title',title);txt('sub',sub);txt('tip',tip);
  fade($('badge'),isStep?io:0,(1-eOut(prog(u,0,.45)))*-30);
  $('badge').style.transform+=` scale(${isStep?(0.6+0.4*eOut(prog(u,0,.5))).toFixed(3):1})`;
  fade($('title'),isStep?io:0,(1-eOut(prog(u,.05,.5)))*30);
  fade($('sub'),isStep?Math.min(io,eOut(prog(u,.3,.8))):0);
  fade($('tip'),isStep?Math.min(io,eOut(prog(u,1.2,1.7))):0,(1-eOut(prog(u,1.2,1.7)))*30);
  fade($('intro'),c.kind==='intro'?io:0,(1-eOut(prog(u,0,.6)))*40);
  fade($('outro'),c.kind==='outro'?Math.min(eOut(prog(u,0,.5)),1-prog(u,L-.4,L)):0,(1-eOut(prog(u,0,.6)))*40);

  const diag=['hook','place','cover','flip','write','cta','light'].includes(c.kind);
  D.setAttribute('opacity',(diag?io:0).toFixed(3));
  setupG.setAttribute('opacity',(c.kind==='setup'?io:0).toFixed(3));
  const pvOn=isStep?io:0; PV.setAttribute('opacity',pvOn.toFixed(3)); fade($('plabel'),pvOn);
  showPv(c.kind,1);
  recT.textContent='REC 00:0'+Math.floor(u%8); recDot.setAttribute('opacity',(Math.floor(t*2)%2?1:.25));

  // defaults
  rays.setAttribute('opacity',0.55); backLamp.setAttribute('opacity',0);
  held.setAttribute('opacity',0); thought.setAttribute('opacity',0);
  motion.setAttribute('opacity',0); motionHead.setAttribute('opacity',0);
  P.setAttribute('opacity',1); tripod.setAttribute('opacity',1); phone.setAttribute('opacity',1);
  head.setAttribute('transform','translate(842,680)');
  book.setAttribute('transform','translate(540,900)'); bookBody.setAttribute('x',-60);bookBody.setAttribute('y',-18);bookBody.setAttribute('width',120);bookBody.setAttribute('height',18);
  setArm(700,880);

  if(c.kind==='setup'){
    const r=eIO(prog(u,.3,1.3));                       // rotate to vertical
    bigPhone.setAttribute('transform',`translate(540,800) rotate(${(-90*(1-r)).toFixed(1)}) scale(.85)`);
    cross.setAttribute('opacity',(prog(u,0,.3)*(1-prog(u,.9,1.2))).toFixed(2)); cross.setAttribute('transform','translate(540,800)');
    tick.setAttribute('opacity',eOut(prog(u,1.3,1.6)).toFixed(2)); tick.setAttribute('transform','translate(740,1020) scale(.8)');
    const w=prog(u,2.2,4.0); lens.setAttribute('opacity',(eOut(prog(u,2.0,2.3))*(1-prog(u,4.0,4.3))).toFixed(2));
    lens.setAttribute('transform','translate(330,1020)'); cloth.setAttribute('transform',`translate(${(Math.sin(w*Math.PI*4)*45).toFixed(1)},0)`);
    bpText.textContent=u<1.3?'':'1080p · 30';
  }
  if(c.kind==='light'){
    P.setAttribute('opacity',0); tripod.setAttribute('opacity',0); phone.setAttribute('opacity',0); cone.setAttribute('opacity',0);
    const bad=u>2.4;
    rays.setAttribute('opacity',(bad?0.12:0.75*(0.85+0.15*Math.sin(u*4))).toFixed(2));
    backLamp.setAttribute('opacity',bad?eOut(prog(u,2.4,2.8)):0);
    book.setAttribute('transform','translate(540,900)');
    pv.light.setAttribute('opacity',1);
  }
  if(c.cam){
    let [cx,cy]=c.cam; const [ax,ay]=c.aim;
    if(c.kind==='cover'){const k=eIO(prog(u,.6,3.6));cx=lerp(c.cam[0],c.cam2[0],k);cy=lerp(c.cam[1],c.cam2[1],k);
      motion.setAttribute('d',`M${c.cam[0]+30},${c.cam[1]-80} L${c.cam2[0]+10},${c.cam2[1]-80}`);motion.setAttribute('opacity',io*.9);
      motionHead.setAttribute('points',`${c.cam2[0]+28},${c.cam2[1]-80} ${c.cam2[0]+2},${c.cam2[1]-96} ${c.cam2[0]+2},${c.cam2[1]-64}`);motionHead.setAttribute('opacity',io*.9);
      motion.setAttribute('stroke-dashoffset',(-u*40).toFixed(1));
      book.setAttribute('transform','translate(540,900)');bookBody.setAttribute('x',-12);bookBody.setAttribute('y',-150);bookBody.setAttribute('width',24);bookBody.setAttribute('height',150);
      P.setAttribute('opacity',0);
      pvCover.setAttribute('transform',`translate(540,1460) scale(${(0.8+0.55*k).toFixed(3)})`);
    }
    setCam(cx,cy,ax,ay,io*.9);
  } else { cone.setAttribute('opacity',0); if(c.kind!=='light'){tripod.setAttribute('opacity',0);phone.setAttribute('opacity',0)} }

  if(c.kind==='hook'){
    book.setAttribute('opacity',0);
    held.setAttribute('opacity',1); held.setAttribute('transform','translate(760,760) rotate(-20)');
    setArm(745,800);
    const look=u>1.6&&u<3.2;            // looks up, trying to remember
    head.setAttribute('transform',`translate(842,${look?672:690}) rotate(${look?-14:12})`);
    thought.setAttribute('opacity',eOut(prog(u,2.0,2.4)).toFixed(2)); thought.setAttribute('transform','translate(760,590)');
    pvEyes.setAttribute('transform',`translate(0,${look?-12:6})`); pvQ.setAttribute('opacity',eOut(prog(u,2.0,2.4)));
  } else book.setAttribute('opacity',1);
  if(c.kind==='place'){
    const k=eIO(prog(u,.5,2.4)); const by=lerp(760,900,k);
    book.setAttribute('transform',`translate(${lerp(640,560,k).toFixed(1)},${by.toFixed(1)})`); setArm(lerp(660,600,k),by-12);
    pvPlace.setAttribute('transform',`translate(0,${lerp(1290,1560,k).toFixed(1)})`);
  }
  if(c.kind==='flip'){
    book.setAttribute('transform','translate(540,900)'); bookBody.setAttribute('x',-110);bookBody.setAttribute('width',220);bookBody.setAttribute('height',10);bookBody.setAttribute('y',-10);
    const f=(u*0.9)%1, sx=Math.cos(f*Math.PI);
    pvPage.setAttribute('transform',`translate(540,0) scale(${sx.toFixed(3)},1) translate(-540,0)`);
    pvHand.setAttribute('cx',(540+110*sx).toFixed(1)); pvHand.setAttribute('cy',1530);
    setArm(lerp(640,470,(Math.sin(u*Math.PI*1.8)+1)/2),888);
  }
  if(c.kind==='write'){
    book.setAttribute('transform','translate(540,900)'); bookBody.setAttribute('x',-110);bookBody.setAttribute('width',220);bookBody.setAttribute('height',10);bookBody.setAttribute('y',-10);
    const k=prog(u,.8,2.2);
    const pts=[[530,1468],[548,1488],[578,1450]];
    const seg=k<.4?k/.4:1, seg2=k<.4?0:(k-.4)/.6;
    const px=k<.4?lerp(pts[0][0],pts[1][0],seg):lerp(pts[1][0],pts[2][0],seg2), py=k<.4?lerp(pts[0][1],pts[1][1],seg):lerp(pts[1][1],pts[2][1],seg2);
    pvPen.setAttribute('transform',`translate(${px.toFixed(1)},${py.toFixed(1)})`);
    pvCheck.style.strokeDasharray=90; pvCheck.style.strokeDashoffset=(90*(1-k)).toFixed(1);
    setArm(560+8*Math.sin(u*9),884);
  }
  if(c.kind==='cta'){
    book.setAttribute('opacity',0);
    const k=eIO(prog(u,.6,2.6));
    held.setAttribute('opacity',1); held.setAttribute('transform',`translate(${lerp(760,640,k).toFixed(1)},${lerp(780,720,k).toFixed(1)}) rotate(${lerp(-20,90,k).toFixed(1)}) scale(${lerp(1,.9,k).toFixed(3)})`);
    setArm(lerp(745,660,k),lerp(820,790,k));
    pvCta.setAttribute('transform',`translate(540,1460) scale(${lerp(.55,1.25,k).toFixed(3)})`);
  }
  $('stage').style.opacity=(eOut(prog(t,0,.25))*(1-prog(t,DUR-.3,DUR))).toFixed(3);
};
window.DUR=DUR;
render(0);
</script>
</body>
