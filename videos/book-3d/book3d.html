<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#03140f}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#0f5242 0%,#073027 48%,#020e0a 100%)}
  .t{position:absolute;left:50px;right:50px;text-align:center;color:#f3e3b3;font-family:'Noto Kufi Arabic',sans-serif;filter:drop-shadow(0 4px 10px rgba(0,0,0,.85)) drop-shadow(0 0 3px rgba(0,0,0,.9))}
  .gold{background:linear-gradient(180deg,#fff2c4,#e8c46a 50%,#c39232);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* ---------- 3D ---------- */
  #view{position:absolute;left:0;top:0;width:1080px;height:1920px;perspective:2600px;perspective-origin:540px 900px}
  #cam{position:absolute;left:540px;top:900px;width:0;height:0;transform-style:preserve-3d}
  #book{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
  .f{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  #shadow{position:absolute;left:-330px;top:380px;width:660px;height:90px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);filter:blur(6px)}
  img.tex{width:100%;height:100%;display:block}
  .shade{position:absolute;inset:0;pointer-events:none}
  /* ---------- photo section ---------- */
  #panel{position:absolute;left:40px;top:430px;width:1000px;height:1000px;border-radius:30px;overflow:hidden;background:#e4e4e2;
    box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 4px rgba(232,196,106,.55);opacity:0}
  #photo{position:absolute;left:0;top:0;width:2000px;height:2000px;transform-origin:0 0}
  #photo img,#photo svg{position:absolute;inset:0;width:2000px;height:2000px}
  .card{position:absolute;left:90px;right:90px;top:1490px;height:280px;border-radius:30px;background:rgba(6,40,31,.92);
    border:3px solid rgba(232,196,106,.8);display:flex;align-items:center;gap:36px;padding:0 44px;box-sizing:border-box;color:#f3e3b3;opacity:0}
  .ring{width:190px;height:190px;border-radius:50%;flex:none;display:grid;place-items:center}
  .ring span{width:156px;height:156px;border-radius:50%;background:#06281f;display:grid;place-items:center;font:700 66px 'Noto Kufi Arabic';color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="view"><div id="cam">
    <div id="shadow"></div>
    <div id="book"></div>
  </div></div>

  <div id="panel"><div id="photo"><img src="img/frames.jpg">
    <svg viewBox="0 0 2000 2000">
      <defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <marker id="ah" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff5d73"/></marker></defs>
      <polygon id="hA" points="1010,690 2000,250 2000,470 1070,880" fill="rgba(255,93,115,.10)" stroke="#ff5d73" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
      <polygon id="hB" points="560,1130 2000,520 2000,760 600,1320" fill="rgba(70,170,255,.10)" stroke="#46aaff" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
      <path id="arrow" d="M1150,900 C1080,980 1000,1040 940,1110" fill="none" stroke="#ff5d73" stroke-width="12" stroke-linecap="round" marker-end="url(#ah)"/>
      <rect id="hT" x="290" y="450" width="620" height="640" rx="40" fill="none" stroke="#7ee2a8" stroke-width="12" filter="url(#glow)"/>
      <g fill="none" stroke="#1f9d55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
        <path id="k0" d="M385,712 L408,740 L448,684"/><path id="k1" d="M430,845 L453,873 L493,817"/><path id="k2" d="M497,968 L520,996 L560,940"/></g>
    </svg></div></div>

  <div id="title" class="t" style="top:120px"></div>
  <div id="cap" class="t" style="top:1500px"></div>
  <div class="card" id="cnt"><div class="ring" id="ring"><span id="num">0</span></div>
    <div><div id="cntName" style="font:700 62px 'Noto Kufi Arabic';color:#fff">البناء</div><div id="cntSub" style="font:400 34px 'Noto Kufi Arabic';color:#cfe8dc">15 مرة</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),prog=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3),eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,eBack=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const DUR=41;

/* ---------- build the 3D book ---------- */
const W=520,H=728,T=62;           // page size 1000x1400 ratio, thickness
const B=$('book');
function face(id,w,h,css,inner){const d=document.createElement('div');d.className='f';if(id)d.id=id;
  d.style.cssText=`width:${w}px;height:${h}px;left:${-w/2}px;top:${-h/2}px;${css}`;d.innerHTML=inner||'';B.appendChild(d);return d}
const GREEN='linear-gradient(135deg,#0f5a48,#0a3f33 60%,#06281f)';
const EDGE='repeating-linear-gradient(90deg,#f6efdc 0 2px,#ddd0b2 2px 4px)';
const EDGEV='repeating-linear-gradient(0deg,#f6efdc 0 2px,#ddd0b2 2px 4px)';
// back cover
face('back',W,H,`background:${GREEN};transform:translateZ(${-T/2}px) rotateY(180deg);border-radius:6px`);
// page block faces (slightly inset)
const PW=W-10,PH=H-12,PT=T-8;
face('fore',PT,PH,`background:${EDGE};transform:translateX(${-W/2+5}px) rotateY(-90deg)`);           // left fore-edge (outer)
face('topE',PW,PT,`background:${EDGEV};transform:translateY(${-PH/2}px) rotateX(90deg)`);
face('botE',PW,PT,`background:${EDGEV};transform:translateY(${PH/2}px) rotateX(-90deg)`);
// spine on the right (Arabic binding)
face('spine',T,H,`background:${GREEN};transform:translateX(${W/2}px) rotateY(90deg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 30px 0 -26px #e8c46a,inset 0 -30px 0 -26px #e8c46a`,
  `<div style="transform:rotate(-90deg);white-space:nowrap;font:700 24px 'Noto Naskh Arabic';color:#e8c46a">المرشد المعين في تسهيل حفظ القرآن الكريم</div>`);
// first page (revealed after the turning leaf) and the turning leaf
face('p1',PW,PH,`transform:translateZ(${T/2-5}px);background:#f7f2e6`,`<img class="tex" src="img/page_left.jpg"><div class="shade" id="p1sh"></div>`);
const leaf=document.createElement('div');leaf.id='leaf';leaf.style.cssText=`position:absolute;left:${-PW/2}px;top:${-PH/2}px;width:${PW}px;height:${PH}px;transform-style:preserve-3d;transform-origin:${PW}px 50%`;
leaf.innerHTML=`<div class="f" style="inset:0;width:100%;height:100%"><img class="tex" src="img/page_right.jpg"><div class="shade" id="lfsh"></div></div>
  <div class="f" style="inset:0;width:100%;height:100%;transform:rotateY(180deg);background:#f4eedf"><div class="shade" id="lbsh"></div></div>`;
B.appendChild(leaf);
// front cover (hinge on right edge)
const cover=document.createElement('div');cover.id='cover';cover.style.cssText=`position:absolute;left:${-W/2}px;top:${-H/2}px;width:${W}px;height:${H}px;transform-style:preserve-3d;transform-origin:${W}px 50%`;
cover.innerHTML=`<div class="f" style="inset:0;width:100%;height:100%;border-radius:4px 8px 8px 4px;overflow:hidden"><img class="tex" src="img/cover.jpg"><div class="shade" id="cfsh"></div></div>
  <div class="f" style="inset:0;width:100%;height:100%;transform:rotateY(180deg);background:#efe7d3;border-radius:8px 4px 4px 8px;display:grid;place-items:center">
    <div style="font:700 40px 'Noto Naskh Arabic';color:#b98a2e;opacity:.55;text-align:center;line-height:1.6">المرشد المعين<br><span style="font-size:26px">مكتبة الرونق</span></div><div class="shade" id="cbsh"></div></div>`;
B.appendChild(cover);

/* ---------- timeline ---------- */
// camera keyframes: [t, x, y, scale, rotX, rotY, rotZ]
const CAM=[[0,0,120,0.55,24,-42,-6],[3.2,0,0,0.92,10,-14,0],[4.2,0,0,0.92,8,-10,0],[6.6,-260,0,0.78,6,-4,0],[9.4,-260,0,0.80,4,-2,0],
           [11.6,-400,330,2.1,0,0,0],[12.6,-480,420,2.6,0,0,0],[13.2,-480,420,2.6,0,0,0],
           [35.2,0,60,0.6,20,-30,0],[37.0,0,0,0.95,8,-16,0],[41,0,0,1.0,6,-10,0]];
function camAt(t){if(t<=CAM[0][0])return CAM[0];for(let i=1;i<CAM.length;i++){if(t<=CAM[i][0]){const a=CAM[i-1],b=CAM[i],k=eIO(prog(t,a[0],b[0]));return a.map((v,j)=>lerp(v,b[j],k))}}return CAM[CAM.length-1]}
// photo camera: [t,cx,cy,zoom]
const PC=[[13.0,1000,1000,1.0],[14.2,1000,1000,1.0],[15.4,1480,600,2.0],[17.8,1520,580,2.05],[19.0,1250,950,1.9],[20.8,1230,960,1.95],[21.8,1250,790,1.35],[23.8,1250,800,1.38],[25.0,600,770,2.35],[35.4,600,770,2.45]];
function pcAt(t){if(t<=PC[0][0])return PC[0];for(let i=1;i<PC.length;i++){if(t<=PC[i][0]){const a=PC[i-1],b=PC[i],k=eIO(prog(t,a[0],b[0]));return a.map((v,j)=>lerp(v,b[j],k))}}return PC[PC.length-1]}
function dl(el){const L=el.getTotalLength();el.style.strokeDasharray=L;return L}
const LA=dl($('hA')),LB=dl($('hB')),LR=dl($('arrow')),LT=dl($('hT')),LK=[0,1,2].map(i=>dl($('k'+i)));
const draw=(el,L,k)=>{el.style.strokeDashoffset=L*(1-k)};
const TXT=[
 [0.3,4.0,'<div class="gold" style="font:700 84px Amiri,serif;line-height:1.25">المرشد المعين</div><div style="font:400 42px \'Noto Naskh Arabic\';margin-top:6px">في تسهيل حفظ القرآن الكريم</div>',''],
 [4.2,9.6,'<div style="font-size:56px;font-weight:700">افتح الكتاب…</div>','<div style="font-size:46px;line-height:1.6">كل صفحة مقسّمة إلى<br><span class="gold" style="font-weight:700">إطارات صغيرة ملوّنة</span></div>'],
 [9.8,13.2,'<div style="font-size:56px;font-weight:700">لا تحفظ صفحة…</div>','<div class="gold" style="font-size:60px;font-weight:700">احفظ إطارًا</div>'],
 [13.4,18.0,'<div style="font-size:56px;font-weight:700">إطارات مترابطة</div>','<div style="font-size:48px;font-weight:700"><span style="color:#ff8c9c">آخر سطر</span> في الإطار…</div>'],
 [18.0,21.8,'<div style="font-size:56px;font-weight:700">إطارات مترابطة</div>','<div style="font-size:44px;font-weight:700;line-height:1.5">…يُعاد في <span style="color:#7cc4ff">أول الإطار التالي</span><br>بنفس اللون</div>'],
 [21.8,24.6,'<div style="font-size:56px;font-weight:700">إطارات مترابطة</div>','<div style="font-size:46px;font-weight:700;line-height:1.5">فلا ينقطع الحفظ<br><span class="gold">ولا تضيع الآية بين إطارين</span></div>'],
 [24.6,32.8,'<div style="font-size:56px;font-weight:700">طريقة التكرار</div><div style="font:400 40px \'Noto Naskh Arabic\';margin-top:8px;color:#cfe8dc">بجانب كل إطار: ثلاث مراحل</div>',''],
 [32.8,35.0,'<div style="font-size:96px;font-weight:700"><span class="gold">50</span> تكرارًا</div><div style="font-size:40px;color:#cfe8dc">لكل إطار… ثم ضع العلامة ✓</div>',''],
 [35.6,41,'<div class="gold" style="font:700 80px Amiri,serif;line-height:1.25">المرشد المعين</div><div style="font:400 40px \'Noto Naskh Arabic\';margin-top:6px">في تسهيل حفظ القرآن الكريم</div>',
   '<div style="font-size:60px;font-weight:700;color:#fff">اطلب نسختك الآن</div><div style="font-size:36px;color:#e8c46a;margin-top:8px">الجزء الأول · الجزء الثاني · رواية ورش</div>'],
];
const COUNTS=[[25.6,28.0,'البناء',15],[28.0,30.4,'التثبيت',20],[30.4,32.8,'الترسيخ',15]];
let cur=-9;
window.render=function(t){
  // --- 3D book ---
  const inBook=t<13.3||t>35.0;
  $('view').style.opacity=Math.min(1-prog(t,12.6,13.3)+(t>35?1:0),1)*(t>35?eOut(prog(t,35.0,35.8)):1);
  const [,x,y,s,rx,ry,rz]=camAt(t);
  $('cam').style.transform=`translate(${x}px,${y}px) scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  const open=t<35?eIO(prog(t,4.2,6.6)):1-eIO(prog(t,35.2,36.8));
  const ca=open*178;
  $('cover').style.transform=`rotateY(${ca}deg) translateZ(${T/2}px)`;
  const lf=t<35?eIO(prog(t,7.0,9.2))*176:0;
  $('leaf').style.transform=`translateZ(${T/2-3}px) rotateY(${lf}deg)`;
  // simple lighting by angle
  const lit=a=>Math.max(0,Math.sin(a*Math.PI/180))*0.45;
  $('cfsh').style.background=`rgba(0,0,0,${lit(ca)})`;$('cbsh').style.background=`rgba(0,0,0,${0.25*(1-open)})`;
  $('lfsh').style.background=`rgba(0,0,0,${lit(lf)})`;$('lbsh').style.background=`rgba(0,0,0,${0.3*Math.max(0,1-lf/176)})`;
  $('p1sh').style.background=`rgba(0,0,0,${0.18*(1-prog(t,8,9.4))})`;
  $('shadow').style.opacity=1-prog(t,10.5,11.5)+(t>35?1:0);
  // --- photo panel ---
  const po=t<23?eOut(prog(t,12.9,13.6)):1-prog(t,35.0,35.6);$('panel').style.opacity=t>12.9&&t<35.6?po:0;
  const [,cx,cy,z]=pcAt(t);const k=1000/2000*z;
  $('photo').style.transform=`translate(500px,500px) scale(${k}) translate(${-cx}px,${-cy}px)`;
  draw($('hA'),LA,eIO(prog(t,15.5,16.5)));draw($('hB'),LB,eIO(prog(t,19.1,20.1)));
  $('arrow').style.opacity=prog(t,21.95,22.0)*(1-prog(t,24.4,24.9));draw($('arrow'),LR,eIO(prog(t,22.0,22.9)));
  ['hA','hB'].forEach(i=>$(i).style.opacity=1-prog(t,24.4,24.9));
  $('hT').style.opacity=t>25.0?1:0;draw($('hT'),LT,eIO(prog(t,25.0,25.7)));
  COUNTS.forEach((c,i)=>{const kk=eOut(prog(t,c[1]-.4,c[1]-.05));draw($('k'+i),LK[i],kk);$('k'+i).style.opacity=kk>.02?1:0});
  const ci=COUNTS.findIndex(c=>t>=c[0]&&t<c[1]);
  if(ci>=0){const [a,b,name,n]=COUNTS[ci];const v=Math.round(eIO(prog(t,a+.2,b-.4))*n);
    $('num').textContent=v;$('cntName').textContent=name;$('cntSub').textContent=n+' مرة'+(v===n?'  ✓':'');
    $('ring').style.background=`conic-gradient(#e8c46a ${v/n*360}deg,rgba(255,255,255,.15) 0)`;$('cnt').style.opacity=Math.min(eOut(prog(t,a,a+.25)),ci===2?1-prog(t,b-.2,b):1);}
  else $('cnt').style.opacity=0;
  // --- text ---
  const ti=TXT.findIndex(x=>t>=x[0]&&t<x[1]);
  if(ti!==cur){cur=ti;$('title').innerHTML=ti<0?'':TXT[ti][2];$('cap').innerHTML=ti<0?'':TXT[ti][3]}
  if(ti>=0){const [a,b]=TXT[ti];$('title').style.opacity=Math.min(eOut(prog(t,a,a+.4)),1-prog(t,b-.3,b));
    $('cap').style.opacity=Math.min(eOut(prog(t,a+.3,a+.7)),1-prog(t,b-.3,b));
    $('cap').style.transform=`translateY(${(1-eOut(prog(t,a+.3,a+.8)))*30}px)`;}
  else{$('title').style.opacity=0;$('cap').style.opacity=0}
  // CTA caption sits lower in the book scenes
  $('cap').style.top=(t>35.5||t<13.3)?'1640px':'1500px';
  $('stage').style.opacity=eOut(prog(t,0,.3))*(1-prog(t,DUR-.35,DUR));
};
render(0);
</script>
</body>
</html>
